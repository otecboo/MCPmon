# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# Ablation: the same engine and the same dataset, but a policy that forbids the *preparation*
# step instead of the completed sequence.
#
# `denyPattern(fs.read -> archive.create)` fires one step earlier than the full pattern, which
# looks better on timeliness — and blocks the legitimate near-miss family
# `clean_near_miss_pattern`, which reads and archives a file without uploading it. That is the
# precision/timeliness trade-off the thesis argues about, made measurable on one dataset:
# recall stays at 1.0, FPR goes from 0.0 to about 0.25, and mean IG drops.
mcp:
  port: 3000
  policies:
    mcpGuardrails:
      processors:
      - kind: sequence
        methods: {"tools/call": request}
        action: reject
        rules:
        - denyTool: shell.exec
        # Early rule: fires as soon as archiving follows a read.
        - denyPattern: [fs.read, archive.create]
        # The pair rule is kept so the upload family is still caught at its final step.
        - denyAfter: {before: fs.read, after: http.post}
  targets:
  - name: mock
    mcp:
      host: http://127.0.0.1:9099/mcp
config:
  session:
    # Auto-generated by agentgateway to encode session IDs. Changing it invalidates existing sessions.
    key: e2bf24cb1ed083b1bcbcc5f851bc44dd0753d1e801f5fbe8fbe67deff5ce7554
