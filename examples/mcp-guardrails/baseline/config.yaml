# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# Latency reference: the same route and the same mock upstream, **no guardrails at all**.
# Replaying `synthetic.jsonl` against this config measures the cost of the proxy path plus
# the mock, so the delta against `enforce/` is what the detector itself adds. History is
# still recorded on every `tools/call` (that happens whenever the MCP router runs), so the
# delta isolates rule evaluation, not call recording.
mcp:
  port: 3000
  targets:
  - name: mock
    mcp:
      host: http://127.0.0.1:9099/mcp
config:
  session:
    # Auto-generated by agentgateway to encode session IDs. Changing it invalidates existing sessions.
    key: 5af83a646eabccdc8162d00e7d8639a44e1b017b134db3158ccc818bf4166f51
