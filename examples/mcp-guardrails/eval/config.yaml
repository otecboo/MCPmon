# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# Evaluation gateway, audit mode (`action: flag`): the detector runs, records matches in
# `mcpGuardrails.anomaly` and never blocks. Use this run to prove that the rules fire and
# that nothing is rejected by accident.
#
# Rules are listed in decision order: the first match wins. `denyPattern` is deliberately
# ahead of `denyAfter`, so the three-call exfiltration reports the pattern rather than the
# pair that also matches at the same final step.
logging:
  # Required by `replay.py --mode flag`: the audit decision is only in the log, and the
  # reader expects one JSON object per line.
  format: json
mcp:
  port: 3000
  policies:
    mcpGuardrails:
      processors:
      - kind: sequence
        methods: {"tools/call": request}
        action: flag
        rules:
        - denyTool: shell.exec
        - denyPattern: [fs.read, archive.create, http.post]
        - denyAfter: {before: fs.read, after: http.post}
  targets:
  - name: mock
    mcp:
      # eval/mcp_mock.py
      host: http://127.0.0.1:9099/mcp
config:
  session:
    # Auto-generated by agentgateway to encode session IDs. Changing it invalidates existing sessions.
    key: b2824c2390c6f4b5242cb66fb180960ff9ec827121cd7ad1c09843750969ead1
